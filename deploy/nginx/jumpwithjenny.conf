# === HTTP Redirects to HTTPS ===
server {
    listen 80;
    server_name jumpwithjenny.com www.jumpwithjenny.com;
    return 301 https://jumpwithjenny.com$request_uri;
}

server {
    listen 80;
    server_name api.jumpwithjenny.com;
    return 301 https://api.jumpwithjenny.com$request_uri;
}

# === HTTPS: Redirect www to apex domain ===
server {
    listen 443 ssl;
    server_name www.jumpwithjenny.com;

    ssl_certificate /etc/letsencrypt/live/jumpwithjenny.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jumpwithjenny.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jumpwithjenny.com$request_uri;
}

# === HTTPS: Main Website ===
server {
    listen 443 ssl;
    server_name jumpwithjenny.com;

    root /var/www/jumpwithjenny/client-app/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/jumpwithjenny.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jumpwithjenny.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20M;
    keepalive_timeout 30s;
    autoindex off;
    disable_symlinks on;

    # Security headers & single-line CSP (inherited by location blocks without add_header)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://connect.facebook.net https://www.googletagmanager.com https://embeds.iubenda.com https://cdn.iubenda.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://jumpwithjenny.com https://api.jumpwithjenny.com https://accounts.google.com https://oauth2.googleapis.com https://*.googleusercontent.com https://graph.facebook.com https://www.facebook.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://embeds.iubenda.com https://cdn.iubenda.com https://www.iubenda.com; frame-src 'self' https://www.google.com https://accounts.google.com https://www.facebook.com https://staticxx.facebook.com https://web.facebook.com https://www.iubenda.com; upgrade-insecure-requests;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    # Entry HTML must never be immutably cached
    location = /index.html {
        expires -1;
    }

    # Hashed Vite build assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Favicon served from dist/
    location = /favicon_v2.ico {
        alias /var/www/jumpwithjenny/client-app/dist/favicon_v2.ico;
        access_log off;
        log_not_found off;
        expires 1d;
    }

    location = /favicon.ico {
        alias /var/www/jumpwithjenny/client-app/dist/favicon_v2.ico;
        access_log off;
        log_not_found off;
        expires 1d;
    }

    # Metadata & SEO files
    location ~* ^/(?:manifest\.json|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        expires 1d;
        access_log off;
    }

    # Unhashed static media & fonts
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|eot|otf|mp4)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Proxy API requests preserving /api/ prefix
    location /api/ {
        proxy_pass http://127.0.0.1:7024;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny sensitive files
    location ~* /\.(env|git|ht|docker|config)|(/composer\.|/package\.json|/yarn\.lock) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        internal;
        default_type application/json;
        return 500 '{"error":"Internal Server Error"}';
    }
}

# === HTTPS: API Subdomain ===
server {
    listen 443 ssl;
    server_name api.jumpwithjenny.com;

    ssl_certificate /etc/letsencrypt/live/api.jumpwithjenny.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jumpwithjenny.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20M;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:7024;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
